services:
  mate-vision-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8000}
    container_name: mate-vision-flutter-app
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - mate-vision-network

networks:
  mate-vision-network:
    driver: bridge
