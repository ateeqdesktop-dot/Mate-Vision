services:
  api:
    build:
      context: .
      network: host
    networks:
      - mate-network
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODELS_DIR=/app/models
      - CONFIDENCE_THRESHOLD=0.5
      - IOU_THRESHOLD=0.45
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./mobile_app
      network: host
    ports:
      - "80:80"
    networks:
      - mate-network
    depends_on:
      - api
    restart: unless-stopped

networks:
  mate-network:
    driver: bridge
