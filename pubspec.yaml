name: mate_vision_app
description: "AI-powered detection app for car accidents and weapons using YOLO models"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^9.2.0
  
  # Networking
  http: ^1.2.2
  http_parser: ^4.0.2
  
  # Image Handling
  image_picker: ^1.1.2
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Icons
  cupertino_icons: ^1.0.8
  
  # Utilities
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
